name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall src tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: python -m src.cli data/synthetic_endpoint_events.json --output /tmp/endpoint-isolation-assessment.md
